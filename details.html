<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harry Potter by Agathe</title>
    <link rel="icon" type="image/png" href="./images/batman.png" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/script.js" defer type="module"></script>
  </head>
  <body class="page_perso">
    <main>

    <header class="header">

      <div class="header__right">
        <a href="index.html">
        <img src="./images/logo.png" alt="logo"/>
        </a>
      </div>

      <div class="header__left">
        <h1>Wiki Harry Potter by Agathe</h1>
        <img src="./images/menu.png" alt="menu" />
      </div>
    </header>
  

      <section>
        <h3>Harry Potter</h3>
        <div class="perso">
          <figure class="perso__left">
            <img src="./images/harry.webp" alt="harry"/>
            <figcaption>Daniel Radcliffe</figcaption>
          </figure>

          <div class="perso__right">
            
            <div>
              <p class="attr">Gender</p>
              <p>male</p>
            </div>
            <div>
              <p class="attr">Eye</p>
              <p>green</p>
            </div>
            <div>
              <p class="attr">Hair</p>
              <p>black</p>
            </div>
            <div>
              <p class="attr">Date of Birth</p>
              <p>31-07-1980</p>
            </div>
            <div>
              <p class="attr">Patronus</p>
              <p>stag</p>
            </div>
            
          </div>

      </section>
      <section class="house__perso">
        <img src="./images/Gryffindor.png" alt="Gryffindor House"/>
      </section>
    </main>
    <footer>
      <p>Wiki Happy Potter is a FANDOM community</p>
    </footer>
  </body>
</html>
